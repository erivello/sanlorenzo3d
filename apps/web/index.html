<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>San Lorenzo 3D</title>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="hotspots"></div>
    <div id="loading">Caricamento della chiesa…</div>
    <div id="veil"></div>
    <div id="attribution"></div>
    <p id="notice" role="status" hidden></p>

    <aside id="keys" aria-label="Comandi da tastiera">
      <h2>Comandi</h2>
      <dl>
        <dt><kbd>↑</kbd> <kbd>W</kbd></dt><dd>Avanti</dd>
        <dt><kbd>↓</kbd> <kbd>S</kbd></dt><dd>Indietro</dd>
        <dt><kbd>←</kbd></dt><dd>Gira a sinistra</dd>
        <dt><kbd>→</kbd></dt><dd>Gira a destra</dd>
        <dt><kbd>A</kbd></dt><dd>Sposta a sinistra</dd>
        <dt><kbd>D</kbd></dt><dd>Sposta a destra</dd>
        <dt><kbd>Q</kbd></dt><dd>Sali</dd>
        <dt><kbd>E</kbd></dt><dd>Scendi</dd>
        <dt><kbd>Shift</kbd></dt><dd>Più veloce</dd>
      </dl>
    </aside>

    <aside id="panel">
      <header>
        <h1>San Lorenzo di Montagna</h1>
        <p class="subtitle">Guida 3D della chiesa</p>
      </header>
      <section class="exterior-only">
        <p>Il paese visto dall'alto. Ruota e avvicinati, poi entra in chiesa.</p>
        <button id="enter" type="button" class="primary">Entra in chiesa</button>
      </section>
      <button id="exit" type="button" class="interior-only link">‹ Torna al paese</button>
      <ol id="poi-list" class="interior-only"></ol>
      <article id="poi-detail" class="interior-only" hidden>
        <p class="status" id="poi-status"></p>
        <h2 id="poi-title"></h2>
        <div id="poi-body"></div>
        <details id="poi-sources-wrap">
          <summary>Fonti</summary>
          <ul id="poi-sources"></ul>
        </details>
        <nav class="tour-nav">
          <button id="prev" type="button">‹ Precedente</button>
          <button id="overview" type="button">Panoramica</button>
          <button id="next" type="button">Successivo ›</button>
        </nav>
      </article>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
